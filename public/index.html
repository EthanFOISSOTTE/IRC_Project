<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        #messages { list-style-type: none; padding: 0; }
        #messages li { padding: 5px; border-bottom: 1px solid #ddd; }
        #messages li.info { color: orange; }
        #username-container { margin: 10px; }
    </style>
</head>
<body>
<div id="username-container">
    <label for="username">Nom d'utilisateur :</label>
    <input id="username" type="text" autocomplete="off" placeholder="Entrez votre nom" />
    <button id="set-username">Confirmer</button>
</div>
<ul id="messages"></ul>
<form id="form" action="" style="display: none;">
    <input id="input" autocomplete="off" placeholder="Entrez votre message ou /nick nouveau_nom" />
    <button>Envoyer</button>
</form>
<script>
    const socket = io();
    let username = '';

    // Gérer le bouton de confirmation du nom d'utilisateur
    document.getElementById('set-username').addEventListener('click', () => {
        const usernameInput = document.getElementById('username').value.trim();
        if (usernameInput) {
            username = usernameInput;

            // Masquer la zone de saisie du nom et afficher le formulaire de chat
            document.getElementById('username-container').style.display = 'none';
            document.getElementById('form').style.display = 'block';

            // Envoyer une seule fois l'événement set-username au serveur
            socket.emit('set-username', username);
        } else {
            alert('Veuillez entrer un nom d\'utilisateur.');
        }
    });

    // Écouter les anciens messages
    socket.on('previousMessages', (messages) => {
        messages.forEach((msg) => {
            const li = document.createElement('li');
            li.textContent = msg.content;
            document.getElementById('messages').appendChild(li);
        });
    });

    // Écouter les messages de bienvenue
    socket.on('welcome', (msg) => {
        const li = document.createElement('li');
        li.textContent = msg;
        document.getElementById('messages').appendChild(li);
    });

    // Écouter les messages des autres utilisateurs
    socket.on('message', (msg) => {
        const li = document.createElement('li');
        li.textContent = msg;
        document.getElementById('messages').appendChild(li);
    });

    // Écouter les messages de connexion des utilisateurs
    socket.on('user-connected', (msg) => {
        const li = document.createElement('li');
        li.textContent = `${msg}`;
        li.style.color = 'green';
        document.getElementById('messages').appendChild(li);
    });

    // Écouter les messages de déconnexion des utilisateurs
    socket.on('user-disconnected', (msg) => {
        const li = document.createElement('li');
        li.textContent = `${msg}`;
        li.style.color = 'red';
        document.getElementById('messages').appendChild(li);
    });

    // Écouter les messages de changement de pseudo
    socket.on('nickname-changed', (msg) => {
        const li = document.createElement('li');
        li.textContent = msg;
        li.classList.add('info'); // Ajouter la classe pour un style gris
        document.getElementById('messages').appendChild(li);
    });

    // Gérer les envois de messages ou commandes
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value && username) {
            const message = input.value.trim();

            // Vérifier si le message est une commande
            if (message.startsWith('/nick ')) {
                const newUsername = message.split(' ')[1];
                if (newUsername) {
                    socket.emit('change-nickname', newUsername);
                    username = newUsername; // Met à jour le pseudo côté client
                } else {
                    alert('Veuillez entrer un pseudonyme valide après /nick.');
                }
            } else {
                // Envoyer un message classique
                const fullMessage = `${username} : ${message}`;
                socket.emit('message', fullMessage);
            }
            input.value = '';
        }
    });
</script>
</body>
</html>
