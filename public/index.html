<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        #messages { list-style-type: none; padding: 0; }
        #messages li { padding: 5px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
<ul id="messages"></ul>
<form id="form" action="">
    <input id="input" autocomplete="off" />
    <button>Send</button>
</form>
<script>
    const socket = io();

    // Écouter le message de bienvenue
    socket.on('welcome', (msg) => {
        const li = document.createElement('li');
        li.textContent = msg;
        document.getElementById('messages').appendChild(li);
    });

    // Écouter les messages des autres utilisateurs
    socket.on('message', (msg) => {
        const li = document.createElement('li');
        li.textContent = msg;
        document.getElementById('messages').appendChild(li);
    });

    // Écouter les messages de connexion des utilisateurs
    socket.on('user-connected', (msg) => {
        const li = document.createElement('li');
        li.textContent = msg;
        li.style.color = 'green';
        document.getElementById('messages').appendChild(li);
    });

    // Écouter les messages de déconnexion des utilisateurs
    socket.on('user-disconnected', (msg) => {
        const li = document.createElement('li');
        li.textContent = msg;
        li.style.color = 'red';
        document.getElementById('messages').appendChild(li);
    });

    // Envoyer un message
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendButton = document.getElementById('sendButton');

    form.addEventListener('click', (e) => {
        e.preventDefault();
        if (input.value) {
            socket.emit('message', input.value);
            input.value = '';
        }
    });
</script>
</body>
</html>
